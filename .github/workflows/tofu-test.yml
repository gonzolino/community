name: GitHub Org Automation Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tofu Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up tofu
        uses: opentofu/setup-opentofu@v2

      - name: Check tofu formatting
        working-directory: automation
        run: tofu fmt -check -recursive -diff

      - name: Init tofu
        working-directory: automation
        run: tofu init -input=false -backend=false

      - name: Validate tofu
        working-directory: automation
        run: tofu validate
        env:
          # Validate needs the github auth env variables set, but it does not
          # actually authenticate. Therefore we set it to some fake values.
          GITHUB_APP_ID: "fake-app-id"
          GITHUB_APP_INSTALLATION_ID: "fake-app-install-id"
          GITHUB_APP_PEM_FILE: "fake-pem-file"
